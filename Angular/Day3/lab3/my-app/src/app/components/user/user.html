
<div class="user">
    <img class="user-avatar" src="{{ avatar }}" alt="User Avatar">
    <h2 class="user-name">{{ name }}</h2>
    <p class="user-job">{{ job }}</p>
    <p class="user-bio">{{ bio }}</p>
    <button class="btn delete-btn" (click)="onRemoveClicked()">Remove</button>
    <button class="btn view-btn" (click)="onViewClicked()">View</button>
</div>
