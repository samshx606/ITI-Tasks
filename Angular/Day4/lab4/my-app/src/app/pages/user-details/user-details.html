<div class="content">
    <h1 class="title">User Details</h1>
    <div class="user">
        <img class="user-avatar" src="profile.jpg" alt="avatar">
        <h2 class="user-name">{{ user?.name }}</h2>
        <p class="user-email">{{ user?.email }}</p>
        <p class="user-website">{{ user?.website }}</p>
        <button class="user-btn" (click)="backToUsers()">Back to Users</button>
    </div>
</div>
